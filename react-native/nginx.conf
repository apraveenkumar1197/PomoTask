server {
    listen 80;
    server_name srv459993.hstgr.cloud;

    root /usr/share/nginx/html;
    index index.html;

    # The Expo web build is exported with experiments.baseUrl = "/pomotask"
    # (app.json), so every asset URL it emits is prefixed with /pomotask.
    # Serve the same build output under that prefix as well as the root.
    location /pomotask/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /pomotask/index.html;
    }

    location / {
        try_files $uri /index.html;
    }
}