services:
  mongo:
    image: mongo:7
    container_name: pomotask_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-pomotask}
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - pomotask_net

  django:
    build:
      context: ./django
      dockerfile: Dockerfile
    container_name: pomotask_django
    restart: unless-stopped
    environment:
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      DB_NAME: ${DB_NAME:-pomotask}
      DB_USER: ${DB_USER:?set DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      # Force the app to talk to the "mongo" service over the compose
      # network, regardless of any other DB_HOST value.
      DB_HOST: mongo
      AUTH_USERNAME: ${AUTH_USERNAME:?set AUTH_USERNAME}
      AUTH_PASSWORD: ${AUTH_PASSWORD:?set AUTH_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_EXPIRY_MINUTES: ${JWT_EXPIRY_MINUTES:-3600}
      # Optional — the daily backup_database cron job (baked into this image)
      # skips itself cleanly if this isn't set, so it's not required.
      DROPBOX_ACCESS_TOKEN: ${DROPBOX_ACCESS_TOKEN:-}
    depends_on:
      - mongo
    ports:
      - "4310:8000"
    networks:
      - pomotask_net

  react-native:
    build:
      context: ./react-native
      dockerfile: Dockerfile
      # Required — do not rely on react-native/.env being picked up by COPY.
      # It's gitignored, and Docker Desktop's build-context transfer on this
      # setup excludes gitignored files even for a plain local build (verified
      # directly: COPY . . here does not bring in .env at all, regardless of
      # where the build runs from). Set these in your shell or a root .env
      # before running `docker compose build`/`up --build`.
      args:
        EXPO_PUBLIC_API_BASE_URL_MS1: ${EXPO_PUBLIC_API_BASE_URL_MS1:?set EXPO_PUBLIC_API_BASE_URL_MS1}
        EXPO_PUBLIC_API_BASE_URL_MS2: ${EXPO_PUBLIC_API_BASE_URL_MS2:?set EXPO_PUBLIC_API_BASE_URL_MS2}
    container_name: pomotask_react_native
    restart: unless-stopped
    # No env_file/environment here: EXPO_PUBLIC_* get baked into the static
    # bundle at build time (see build.args above), not read by nginx (this
    # container's actual runtime process) at container start.
    depends_on:
      - django
    ports:
      - "4392:80"
    networks:
      - pomotask_net

volumes:
  mongo_data:
    name: pomotask_mongo_data

networks:
  pomotask_net:
    name: pomotask_net
    driver: bridge
