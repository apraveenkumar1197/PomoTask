services:
  mongo:
    image: mongo:7
    container_name: pomotask_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-pomotask}
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - pomotask_net

  django:
    build:
      context: ./django
      dockerfile: Dockerfile
    container_name: pomotask_django
    restart: unless-stopped
    environment:
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      DB_NAME: ${DB_NAME:-pomotask}
      DB_USER: ${DB_USER:?set DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      # Force the app to talk to the "mongo" service over the compose
      # network, regardless of any other DB_HOST value.
      DB_HOST: mongo
      AUTH_USERNAME: ${AUTH_USERNAME:?set AUTH_USERNAME}
      AUTH_PASSWORD: ${AUTH_PASSWORD:?set AUTH_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_EXPIRY_MINUTES: ${JWT_EXPIRY_MINUTES:-3600}
    depends_on:
      - mongo
    ports:
      - "4310:8000"
    networks:
      - pomotask_net

  react-native:
    build:
      context: ./react-native
      dockerfile: Dockerfile
    container_name: pomotask_react_native
    restart: unless-stopped
    # No env_file/environment here: the Dockerfile COPYs react-native/.env
    # into the build context and reads it directly during `npx expo export`,
    # baking EXPO_PUBLIC_* into the static bundle at build time. Docker
    # Compose's env_file/environment only affect the container's runtime
    # process environment, which nginx (this container's actual process)
    # never reads those values from anyway.
    depends_on:
      - django
    ports:
      - "4392:80"
    networks:
      - pomotask_net

volumes:
  mongo_data:
    name: pomotask_mongo_data

networks:
  pomotask_net:
    name: pomotask_net
    driver: bridge
